[project]
name = "user_growth"
authors = [
    { name = "沐泽科技", email = "dev@muze.local" },
]
description = "用户增长中心：用户服务开通/流失单据 + 用户增长分析报表 + 用户增长数据大屏"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
ruff = ">=0.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["B017", "B018", "E101", "E402", "E501", "F401"]
